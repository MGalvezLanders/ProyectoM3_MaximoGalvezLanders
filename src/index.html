<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat bot</title>
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./css/chat.css">
</head>
<body>
    <div class="container">

        <div class="container-header-nav">
            <header class="header">
                <h1>Chat bot</h1>
            </header>
            <nav class="nav">
                <ul class="link-container">
                    <li><a href="/" class="link">Inicio</a></li>
                    <li><a href="/chat" class="link">Chat</a></li>
                    <li><a href="/about" class="link">About</a></li>
                </ul>
            </nav>
        </div>

        <div id="app" class="app">
            <main class="chat">
                <!-- Header del chat -->
                <div class="chat__header">
                    <div class="chat__user">
                    <img src="${window.location.origin}/src/img/brian.webp" alt="Usuario" class="chat__avatar">
                    <span class="chat__name">Brian O'Conner</span>
                    </div>
                </div>
                <!-- Mensajes -->
                <div class="chat__messages">
                </div>
                <!-- Input -->
                <div class="chat__input">
                    <input 
                    type="text" 
                    class="chat__field" 
                    placeholder="Escribí un mensaje..."
                    >
                    <button class="chat__button">Enviar</button>
                </div>
            </main>
            <aside class="aside-characters">
                <div>
                    <h2 class="aside-characters__title">Personajes</h2>
                    <ul class="aside-characters__list">
                        <li class="aside-characters__item">
                            <img src="${window.location.origin}/src/img/brian.webp" alt="Brian O'Conner" class="aside-characters__avatar">
                            <span class="aside-characters__name">Brian O'Conner</span>
                        </li>
                        <li class="aside-characters__item">
                            <img src="${window.location.origin}/src/img/dominic.webp" alt="Dominic Toretto" class="aside-characters__avatar">
                            <span class="aside-characters__name">Dominic Toretto</span>
                        </li>
                        <li class="aside-characters__item">
                            <img src="${window.location.origin}/src/img/tej.webp" alt="Tej Parker" class="aside-characters__avatar">
                            <span class="aside-characters__name">Tej Parker</span>
                        </li>
                    </ul>
                </div>

            </aside>
        </div>

    </div>
    <footer>
        <p>© 2026 Maximo Galvez Landers. Todos los derechos reservados.</p>
    </footer>
    <script type="module" src="./script.js"></script>
</body>

</html>
